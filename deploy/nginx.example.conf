# Put Tryout Radar behind HTTPS on an existing nginx site.
# The secret path must equal server.secret_path in config.toml; everything else on the site is untouched.
# Test and reload: sudo nginx -t && sudo systemctl reload nginx

location ^~ /CHANGE-ME-to-a-long-random-string/ {
    proxy_pass http://127.0.0.1:8091;      # no trailing slash: the path is passed through unchanged
    proxy_set_header Host $host;
    client_max_body_size 8k;
    proxy_read_timeout 25s;
}
